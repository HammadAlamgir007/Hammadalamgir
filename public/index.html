    <!-- Apply the saved / system theme before first paint (no flash) -->
    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add("js");
        var theme = null;
        try { theme = localStorage.getItem("theme"); } catch (e) {}
        var dark = theme ? theme === "dark" : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) {
          root.classList.add("dark");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#08080a");
        }
      })();
    </script>
