<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ffffff" />
    <title>Page not found — Hammad Alamgir</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --fg: #292621; --fg2: #5a534a; --ink: #a3481f; --rule: #d96b35; }
      @media (prefers-color-scheme: dark) { :root { --bg: #1a1714; --fg: #f5efe5; --fg2: #cfc6b8; --ink: #e8834f; --rule: #e8834f; } }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        background: var(--bg); color: var(--fg);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 32rem; }
      .label { display: flex; align-items: center; gap: 12px; margin: 0 0 20px; color: var(--ink);
        font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
      .label::before { content: ""; width: 28px; height: 2px; border-radius: 2px; background: var(--rule); }
      h1 { margin: 0; font-size: clamp(32px, 6vw, 48px); line-height: 1.1; letter-spacing: -.03em; }
      p { margin: 16px 0 32px; color: var(--fg2); font-size: 18px; line-height: 1.6; }
      a.home { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 24px; border-radius: 999px;
        background: var(--ink); color: var(--bg); font-weight: 600; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <p class="label">404</p>
      <h1>This page doesn't exist.</h1>
      <p>The portfolio is a single page — everything is on the home page.</p>
      <a class="home" href="/">Go to the home page →</a>
    </main>
  </body>
</html>
